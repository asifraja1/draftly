spring.application.name=draftly

# Secrets live in an untracked secrets.properties (see secrets.properties.example).
# Values there override the placeholders below.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/draftly
spring.datasource.username=${DB_USERNAME:asifraja}
spring.datasource.password=${DB_PASSWORD:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/gmail.modify
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
gmail.pubsub.topic=projects/YOUR_PROJECT_ID/topics/gmail-topic
server.port=8001

# gRPC server (serves thread context to the Python agent)
grpc.server.port=50051

# Share session cookie across localhost ports (3000 frontend + 8001 backend)
server.servlet.session.cookie.domain=localhost
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=draftly-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.draftly.dto
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka topic names — must match Python agent config
kafka.topic.saving-email=saving_email
kafka.topic.draft-email=draft_email
kafka.topic.output=output_email
